# --- Configuration Environnement de Développement (DEV) ---
spring.application.name=gg-evenements-dev
server.port=8080

# Base de données H2 en mémoire pour le développement sans dépendance externe,
# ou MySQL local si l'URL est spécifiée dans SPRING_DATASOURCE_URL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:ggevenementsdev;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Console H2 accessible sur http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA / Hibernate en mode DEV (affichage du SQL formaté dans les logs)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Données de démonstration activées
app.donnees-demo=true

# Répertoire de téléversement séparé pour dev
app.upload-dir=uploads-dev

# Affichage des messages d'erreur détaillés en mode dev
server.error.include-message=always
