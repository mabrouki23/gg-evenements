spring.application.name=gg-evenements
server.port=8080

# --- Base de données MySQL 8 (local ou Azure) ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ggevenements?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# --- JPA / Hibernate ---
# update : ne modifie jamais les types existants ; complète seulement ce qui manque (le script schema.sql fait foi)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- Langue (messages de validation en français) ---
spring.web.locale=fr_CA
spring.web.locale-resolver=fixed

# --- Téléversement des affiches ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.upload-dir=uploads

# --- Données de démonstration (comptes de test et événements) au premier démarrage ---
app.donnees-demo=true

# --- Sessions : cookie de session non lisible par JavaScript ---
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
