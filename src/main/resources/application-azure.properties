# --- Configuration Azure Spring Boot ---
spring.application.name=gg-evenements

# Configuration de la base de données Azure MySQL Flexible Server
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate pour Azure MySQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Uploads sur Azure App Service (stockage persistant /home/site/wwwroot/uploads)
app.upload-dir=/home/site/wwwroot/uploads

# Données de démo au premier démarrage sur Azure
app.donnees-demo=true
