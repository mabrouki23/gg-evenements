# --- Configuration Azure Spring Boot ---
spring.application.name=gg-evenements

# Configuration Azure SQL Database (Canada Central)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlserver://sql-gg-evenements.database.windows.net:1433;database=ggevenements;encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;loginTimeout=30;}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:gguser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Cgodin2026!SecuredPass}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate pour Azure SQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Uploads sur Azure App Service (stockage persistant /home/site/wwwroot/uploads)
app.upload-dir=/home/site/wwwroot/uploads

# Données de démonstration au premier démarrage sur Azure
app.donnees-demo=true
