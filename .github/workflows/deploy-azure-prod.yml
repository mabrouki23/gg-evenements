name: CI/CD - Déploiement Production Azure (GG'Événements)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-and-deploy-prod:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Configuration de Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build complet avec Maven (Frontend React + Backend Java)
        run: mvn clean package -DskipTests

      - name: Exécution des tests automatisés
        run: mvn test

      - name: Déploiement du JAR sur Azure App Service (Prod)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: 'target/gg-evenements-1.0.0.jar'
