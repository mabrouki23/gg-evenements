name: CI/CD - Environnement Dev (GG'Événements)

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - develop
  pull_request:
    branches:
      - main
      - dev

jobs:
  build-and-test-dev:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Configuration de Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache des modules Node.js
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Build et Tests Unitaires (Profile DEV)
        run: mvn clean package -Dspring.profiles.active=dev

      - name: Archiver le JAR généré (Dev)
        uses: actions/upload-artifact@v4
        with:
          name: gg-evenements-dev-jar
          path: target/gg-evenements-1.0.0.jar
          retention-days: 7

  deploy-dev-azure:
    needs: build-and-test-dev
    if: (github.ref == 'refs/heads/dev' || github.event_name == 'workflow_dispatch') && vars.AZURE_WEBAPP_NAME_DEV != ''
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le JAR généré
        uses: actions/download-artifact@v4
        with:
          name: gg-evenements-dev-jar
          path: target

      - name: Déploiement sur Azure App Service (DEV)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME_DEV }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_DEV }}
          package: 'target/gg-evenements-1.0.0.jar'
